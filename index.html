  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-2: #eef3f8;
      --text: #101621;
      --muted: #566274;
      --soft: #7c8797;
      --line: #dbe3ee;
      --line-strong: #c7d2df;
      --brand: #1c6b5d;
      --brand-2: #2563eb;
      --brand-soft: #e6f3ef;
      --accent: #f59e0b;
      --shadow: 0 18px 45px rgba(27, 39, 57, .10);
      --shadow-soft: 0 8px 24px rgba(27, 39, 57, .07);
      --radius: 8px;
      --nav-h: 72px;
      --max: 1120px;
      --font: "Inter", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #141a22;
      --surface-2: #0f151d;
      --text: #edf2f7;
      --muted: #a9b4c3;
      --soft: #7e8a9b;
      --line: #253142;
      --line-strong: #364559;
      --brand: #4fd1b8;
      --brand-2: #7aa2ff;
      --brand-soft: rgba(79, 209, 184, .12);
      --accent: #fbbf24;
      --shadow: 0 22px 60px rgba(0, 0, 0, .34);
      --shadow-soft: 0 12px 32px rgba(0, 0, 0, .26);
    }

    html { scroll-behavior: smooth; }
    body {
      min-width: 320px;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .10), transparent 28rem),
        radial-gradient(circle at 90% 10%, rgba(28, 107, 93, .12), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; }
    section { scroll-margin-top: calc(var(--nav-h) + 24px); }
    .container { width: min(100% - 40px, var(--max)); margin: 0 auto; }

    .skip-link {
      position: fixed;
      left: 16px;
      top: 12px;
      z-index: 1000;
      transform: translateY(-140%);
      background: var(--text);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: 6px;
      transition: transform .2s ease;
    }
    .skip-link:focus { transform: translateY(0); }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: var(--nav-h);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 84%, transparent);
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(18px);
    }
    .nav {
      min-height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-family: var(--mono);
      font-size: .82rem;
      box-shadow: var(--shadow-soft);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      list-style: none;
      padding: 0;
    }
    .nav-links a,
    .icon-btn {
      min-height: 40px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--muted);
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .nav-links a {
      padding: 0 12px;
      font-size: .91rem;
      font-weight: 600;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: var(--surface);
    }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 42px;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      color: var(--text);
    }
    .icon-btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .icon-btn svg { width: 19px; height: 19px; }
    .theme-icon-dark, [data-theme="dark"] .theme-icon-light { display: none; }
    [data-theme="dark"] .theme-icon-dark { display: block; }
    .menu-btn { display: none; }

    .hero {
      padding: 76px 0 70px;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(300px, .72fr);
      gap: 64px;
      align-items: center;
    }
    .hero-content {
      max-width: 740px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--brand);
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: currentColor;
      border-radius: 99px;
    }
    h1 {
      max-width: 720px;
      margin-top: 16px;
      font-size: clamp(2.45rem, 5.2vw, 4.55rem);
      line-height: 1.02;
      letter-spacing: 0;
      font-weight: 800;
    }
    .hero-copy {
      max-width: 610px;
      margin-top: 22px;
      color: var(--muted);
      font-size: clamp(1rem, 1.35vw, 1.1rem);
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }
    .hero-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .summary-item {
      min-width: 118px;
    }
    .summary-value {
      color: var(--text);
      font-size: 1rem;
      font-weight: 800;
    }
    .summary-label {
      margin-top: 2px;
      color: var(--soft);
      font-family: var(--mono);
      font-size: .72rem;
      text-transform: uppercase;
    }
    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 18px;
      border-radius: 8px;
      border: 1px solid transparent;
      text-decoration: none;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      background: var(--text);
      color: var(--bg);
      box-shadow: var(--shadow-soft);
    }
    .btn-secondary {
      background: var(--surface);
      border-color: var(--line);
      color: var(--text);
    }
    .btn-secondary:hover { border-color: var(--line-strong); box-shadow: var(--shadow-soft); }
    .btn svg, .text-link svg { width: 18px; height: 18px; }

    .hero-panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .hero-panel::before {
      content: "";
      display: block;
      height: 4px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
    }
    .profile-card {
      padding: 24px;
      display: grid;
      gap: 20px;
    }
    .profile-top {
      display: grid;
      grid-template-columns: clamp(96px, 9vw, 124px) 1fr;
      gap: 18px;
      align-items: center;
    }
    .profile-photo-frame {
      width: 100%;
      aspect-ratio: 1;
      align-self: start;
      justify-self: start;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      padding: 6px;
      overflow: hidden;
    }
    .profile-photo {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 5px;
      object-fit: contain;
      object-position: center;
    }
    .profile-name { font-size: 1.2rem; font-weight: 800; line-height: 1.15; }
    .profile-role { color: var(--muted); font-size: .95rem; font-weight: 600; margin-top: 4px; }
    .status {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--brand) 28%, var(--line));
      background: var(--brand-soft);
      color: var(--brand);
      font-family: var(--mono);
      font-size: .75rem;
      font-weight: 600;
    }
    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--brand) 16%, transparent);
    }
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .quick-item {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .quick-item:first-child { border-top: 0; }
    .quick-label {
      color: var(--soft);
      font-family: var(--mono);
      font-size: .72rem;
      text-transform: uppercase;
    }
    .quick-value {
      font-weight: 800;
      color: var(--text);
      text-align: right;
    }
    .stack-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .pill {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 600;
    }

    .section {
      padding: 82px 0;
      border-top: 1px solid var(--line);
    }
    .section-header {
      max-width: 720px;
      margin-bottom: 34px;
    }
    h2 {
      margin-top: 10px;
      font-size: clamp(1.75rem, 3vw, 2.6rem);
      line-height: 1.08;
      letter-spacing: 0;
    }
    .section-lead {
      margin-top: 14px;
      color: var(--muted);
      font-size: 1.02rem;
    }
    .about-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(280px, .88fr);
      gap: 32px;
      align-items: start;
    }
    .copy p {
      color: var(--muted);
      margin-bottom: 15px;
    }
    .copy strong { color: var(--text); }
    .copy .highlight { color: var(--brand); font-weight: 700; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .stat,
    .skill-card,
    .project-card,
    .timeline-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }
    .stat { padding: 18px; }
    .stat-value {
      color: var(--brand);
      font-size: 1.8rem;
      line-height: 1;
      font-weight: 800;
    }
    .stat-label {
      margin-top: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .76rem;
      text-transform: uppercase;
    }
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .skill-card {
      padding: 20px;
      box-shadow: none;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .skill-card:hover,
    .project-card:hover {
      transform: translateY(-4px);
      border-color: color-mix(in srgb, var(--brand) 42%, var(--line));
      box-shadow: var(--shadow-soft);
    }
    .skill-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .skill-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--brand-soft);
      color: var(--brand);
    }
    .skill-icon svg { width: 20px; height: 20px; }
    .skill-name { font-weight: 800; }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .74rem;
      font-weight: 600;
    }
    .timeline {
      display: grid;
      gap: 14px;
    }
    .timeline-item {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 18px;
      padding: 22px;
      box-shadow: none;
    }
    .date {
      color: var(--brand);
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 600;
    }
    .timeline-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.25;
    }
    .timeline-place {
      margin-top: 4px;
      color: var(--soft);
      font-weight: 700;
    }
    .timeline-desc {
      margin-top: 10px;
      color: var(--muted);
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .project-card {
      min-height: 100%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      box-shadow: none;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .project-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }
    .project-num {
      color: var(--soft);
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 600;
    }
    .badge {
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 700;
    }
    .project-card h3 {
      font-size: 1.2rem;
      line-height: 1.25;
      margin-bottom: 10px;
    }
    .project-card p {
      color: var(--muted);
      margin-bottom: 18px;
    }
    .project-card .tag-list { margin-top: auto; }
    .project-links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 20px;
    }
    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }
    .text-link:hover { color: var(--brand); }
    .contact {
      padding: 84px 0;
      text-align: center;
      border-top: 1px solid var(--line);
    }
    .contact-inner {
      width: min(100% - 40px, 720px);
      margin: 0 auto;
    }
    .contact h2 { margin-inline: auto; }
    .contact p {
      margin: 16px auto 0;
      max-width: 620px;
      color: var(--muted);
    }
    .email-link {
      display: inline-flex;
      margin-top: 28px;
      color: var(--brand);
      font-size: clamp(1.1rem, 3vw, 1.75rem);
      font-weight: 800;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    .footer {
      padding: 26px 0;
      border-top: 1px solid var(--line);
      color: var(--soft);
      font-size: .9rem;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .55s ease, transform .55s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      .reveal { opacity: 1; transform: none; }
    }

    @media (max-width: 920px) {
      .hero-grid,
      .about-grid {
        grid-template-columns: 1fr;
      }
      .hero { padding-top: 58px; }
      .hero-panel { max-width: 480px; }
      .skills-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 760px) {
      :root { --nav-h: 66px; }
      .container { width: min(100% - 28px, var(--max)); }
      .menu-btn { display: inline-flex; }
      .nav-links {
        position: fixed;
        inset: var(--nav-h) 14px auto;
        display: none;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        flex-direction: column;
        align-items: stretch;
      }
      .nav-links.open { display: flex; }
      .nav-links a { justify-content: flex-start; }
      .brand span:last-child { display: none; }
      .hero { padding: 42px 0 58px; }
      h1 { font-size: clamp(2.35rem, 12vw, 3.75rem); }
      .hero-copy { font-size: 1rem; }
      .hero-actions .btn { width: 100%; }
      .profile-top {
        grid-template-columns: 92px 1fr;
        gap: 14px;
      }
      .hero-summary { gap: 14px; }
      .quick-grid,
      .stats-grid,
      .skills-grid,
      .projects-grid {
        grid-template-columns: 1fr;
      }
      .timeline-item {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .section,
      .contact {
        padding: 62px 0;
      }
      .footer-inner { justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="nav container" aria-label="Primary navigation">
      <a class="brand" href="#home" aria-label="Nirmal Ravidas home">
        <span class="brand-mark">NR</span>
        <span>Nirmal Ravidas</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

      <div class="nav-actions">

  <main id="main"></main>

  <script>
    const content = JSON.parse(document.getElementById("portfolioContent").textContent);
    const root = document.documentElement;
    const themeToggle = document.getElementById("themeToggle");
    const menuToggle = document.getElementById("menuToggle");
    const navLinks = document.getElementById("navLinks");
    const themeColor = document.getElementById("themeColor");
    const savedTheme = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    function applyTheme(theme) {
      root.dataset.theme = theme;
      themeColor.setAttribute("content", theme === "dark" ? "#0d1117" : "#f6f8fb");
      themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
    }

    applyTheme(savedTheme || (prefersDark ? "dark" : "light"));

    const icons = {
      arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>',
      mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>',
      external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>',
      server: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>',
      layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>',
      code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m8 4-6 8 6 8M16 4l6 8-6 8"/></svg>',
      layout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>',
      database: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
      terminal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 4 3-4 3M13 15h4"/></svg>'
    };

    const escapeHTML = (value = "") => String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const isExternal = (href = "") => /^https?:\/\//.test(href);
    const tags = (items = []) => items.map((tag) => `<span class="tag">${escapeHTML(tag)}</span>`).join("");
    const pills = (items = []) => items.map((pill) => `<span class="pill">${escapeHTML(pill)}</span>`).join("");
    const linkAttrs = (href = "") => isExternal(href) ? ' target="_blank" rel="noopener"' : "";

    function renderNav() {
      const brand = document.querySelector(".brand");
      brand.setAttribute("aria-label", `${content.personal.name} home`);
      brand.innerHTML = `
        <span class="brand-mark">${escapeHTML(content.personal.initials)}</span>
        <span>${escapeHTML(content.personal.name)}</span>
      `;

      navLinks.innerHTML = content.navigation.map((item) => `
        <li><a href="${escapeHTML(item.href)}">${escapeHTML(item.label)}</a></li>
      `).join("");
    }

    function renderHero() {
      return `
        <section class="hero" id="home">
          <div class="container hero-grid">
            <div class="hero-content">
              <p class="eyebrow reveal">${escapeHTML(content.hero.eyebrow)}</p>
              <h1 class="reveal">${escapeHTML(content.hero.headline)}</h1>
              <p class="hero-copy reveal">${escapeHTML(content.hero.description)}</p>
              <div class="hero-actions reveal">
                ${content.hero.actions.map((action) => `
                  <a class="btn btn-${escapeHTML(action.style)}" href="${escapeHTML(action.href)}"${linkAttrs(action.href)}>
                    ${escapeHTML(action.label)}
                    ${icons[action.icon] || ""}
                  </a>
                `).join("")}
              </div>
              <div class="hero-summary reveal" aria-label="Professional summary">
                ${content.hero.summary.map((item) => `
                  <div class="summary-item">
                    <p class="summary-value">${escapeHTML(item.value)}</p>
                    <p class="summary-label">${escapeHTML(item.label)}</p>
                  </div>
                `).join("")}
              </div>
            </div>

            <aside class="hero-panel reveal" aria-label="Profile summary">
              <div class="profile-card">
                <div class="profile-top">
                  <div class="profile-photo-frame">
                    <img class="profile-photo" src="${escapeHTML(content.personal.profileImage)}" alt="${escapeHTML(content.personal.profileAlt)}" width="216" height="216" fetchpriority="high" />
                  </div>
                  <div>
                    <p class="profile-name">${escapeHTML(content.personal.name)}</p>
                    <p class="profile-role">${escapeHTML(content.personal.title)}</p>
                    <span class="status">${escapeHTML(content.personal.status)}</span>
                  </div>
                </div>
                <div class="quick-grid">
                  ${content.hero.quickFacts.map((fact) => `
                    <div class="quick-item">
                      <p class="quick-label">${escapeHTML(fact.label)}</p>
                      <p class="quick-value">${escapeHTML(fact.value)}</p>
                    </div>
                  `).join("")}
                </div>
                <div class="stack-strip" aria-label="Key technologies">
                  ${pills(content.hero.stack)}
                </div>
              </div>
            </aside>
          </div>
        </section>
      `;
    }

    function renderAbout() {
      return `
        <section class="section" id="about">
          <div class="container about-grid">
            <div class="section-header reveal">
              <p class="eyebrow">${escapeHTML(content.about.eyebrow)}</p>
              <h2>${escapeHTML(content.about.heading)}</h2>
              <p class="section-lead">${escapeHTML(content.about.lead)}</p>
            </div>
            <div class="copy reveal">
              ${content.about.paragraphs.map((paragraph) => `<p>${escapeHTML(paragraph)}</p>`).join("")}
            </div>
            <div class="stats-grid reveal">
              ${content.about.stats.map((stat) => `
                <div class="stat">
                  <p class="stat-value">${escapeHTML(stat.value)}</p>
                  <p class="stat-label">${escapeHTML(stat.label)}</p>
                </div>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderSkills() {
      return `
        <section class="section" id="skills">
          <div class="container">
            <div class="section-header reveal">
              <p class="eyebrow">${escapeHTML(content.skills.eyebrow)}</p>
              <h2>${escapeHTML(content.skills.heading)}</h2>
            </div>
            <div class="skills-grid">
              ${content.skills.items.map((skill) => `
                <article class="skill-card reveal">
                  <div class="skill-head">
                    <span class="skill-icon">${icons[skill.icon] || ""}</span>
                    <h3 class="skill-name">${escapeHTML(skill.name)}</h3>
                  </div>
                  <div class="tag-list">${tags(skill.tags)}</div>
                </article>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderExperience() {
      return `
        <section class="section" id="experience">
          <div class="container">
            <div class="section-header reveal">
              <p class="eyebrow">${escapeHTML(content.experience.eyebrow)}</p>
              <h2>${escapeHTML(content.experience.heading)}</h2>
            </div>
            <div class="timeline">
              ${content.experience.items.map((item) => `
                <article class="timeline-item reveal">
                  <p class="date">${escapeHTML(item.date)}</p>
                  <div>
                    <h3 class="timeline-title">${escapeHTML(item.title)}</h3>
                    <p class="timeline-place">${escapeHTML(item.place)}</p>
                    <p class="timeline-desc">${escapeHTML(item.description)}</p>
                  </div>
                </article>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderProjects() {
      return `
        <section class="section" id="projects">
          <div class="container">
            <div class="section-header reveal">
              <p class="eyebrow">${escapeHTML(content.projects.eyebrow)}</p>
              <h2>${escapeHTML(content.projects.heading)}</h2>
              <p class="section-lead">${escapeHTML(content.projects.lead)}</p>
            </div>
            <div class="projects-grid">
              ${content.projects.items.map((project) => `
                <article class="project-card reveal">
                  <div class="project-meta">
                    <span class="project-num">${escapeHTML(project.number)}</span>
                    <span class="badge">${escapeHTML(project.type)}</span>
                  </div>
                  <h3>${escapeHTML(project.title)}</h3>
                  <p>${escapeHTML(project.description)}</p>
                  <div class="tag-list">${tags(project.tags)}</div>
                  <div class="project-links">
                    ${(project.links || []).map((link) => `
                      <a class="text-link" href="${escapeHTML(link.href)}"${linkAttrs(link.href)}>
                        ${escapeHTML(link.label)}
                        ${icons.external}
                      </a>
                    `).join("")}
                  </div>
                </article>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderContact() {
      return `
        <section class="contact" id="contact">
          <div class="contact-inner reveal">
            <p class="eyebrow">${escapeHTML(content.contact.eyebrow)}</p>
            <h2>${escapeHTML(content.contact.heading)}</h2>
            <p>${escapeHTML(content.contact.description)}</p>
            <a class="email-link" href="mailto:${escapeHTML(content.personal.email)}">${escapeHTML(content.personal.email)}</a>
            <div class="socials">
              ${content.contact.socials.map((social) => `
                <a class="btn btn-secondary" href="${escapeHTML(social.href)}"${linkAttrs(social.href)}>${escapeHTML(social.label)}</a>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderFooter() {
      const copyrightText = content.footer.copyright.replace("{year}", new Date().getFullYear());
      document.getElementById("siteFooter").innerHTML = `
        <div class="container footer-inner">
          <span>${escapeHTML(copyrightText)}</span>
          <span><a href="${escapeHTML(content.footer.linkHref)}"${linkAttrs(content.footer.linkHref)}>${escapeHTML(content.footer.linkLabel)}</a></span>
        </div>
      `;
    }

    function renderPortfolio() {
      renderNav();
      document.getElementById("main").innerHTML = [
        renderHero(),
        renderAbout(),
        renderSkills(),
        renderExperience(),
        renderProjects(),
        renderContact()
      ].join("");
      renderFooter();
    }

    renderPortfolio();

    themeToggle.addEventListener("click", () => {
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("theme", nextTheme);
      applyTheme(nextTheme);
    });

    menuToggle.addEventListener("click", () => {
      const isOpen = navLinks.classList.toggle("open");
      menuToggle.setAttribute("aria-expanded", String(isOpen));
      menuToggle.setAttribute("aria-label", isOpen ? "Close menu" : "Open menu");
    });

    navLinks.addEventListener("click", (event) => {
      if (event.target.closest("a")) {
        navLinks.classList.remove("open");
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Open menu");
      }
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) entry.target.classList.add("visible");
      });
    }, { threshold: .12 });

    document.querySelectorAll(".reveal").forEach((item) => observer.observe(item));

    const sections = document.querySelectorAll("main section[id]");
    const desktopLinks = navLinks.querySelectorAll("a");
    function setActiveLink() {
      let activeId = "home";
      sections.forEach((section) => {
        if (window.scrollY >= section.offsetTop - 160) activeId = section.id;
      });
      desktopLinks.forEach((link) => {
        link.classList.toggle("active", link.getAttribute("href") === "#" + activeId);
      });
    }
    setActiveLink();
    window.addEventListener("scroll", setActiveLink, { passive: true });
  </script>
