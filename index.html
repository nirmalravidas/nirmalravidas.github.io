    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    .nav-status { font-family:var(--mono); font-size:.7rem; color:var(--muted); display:flex; align-items:center; gap:.4rem; white-space:nowrap; }

    .hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

    .profile-badge { position:absolute; bottom:10px; right:0; font-family:var(--mono); font-size:.65rem; background:var(--surface); border:1px solid var(--border2); color:var(--green); padding:.3rem .7rem; border-radius:20px; white-space:nowrap; letter-spacing:.06em; display:flex; align-items:center; gap:.4rem; }
    .profile-badge .status-dot { width:5px; height:5px; }

    .hero-eyebrow { font-family:var(--mono); font-size:.72rem; color:var(--green); letter-spacing:.2em; text-transform:uppercase; margin-bottom:1rem; display:flex; align-items:center; gap:.8rem; }
    .hero-eyebrow::before { content:''; display:block; width:28px; height:1px; background:var(--green); }
    h1 { font-size:clamp(2.8rem,5.5vw,5rem); font-weight:800; line-height:.95; letter-spacing:-.03em; margin-bottom:1rem; }
    h1 .outline { -webkit-text-stroke:2px var(--green); color:transparent; display:block; }
    .hero-role { font-family:var(--mono); font-size:.95rem; color:var(--blue); margin-bottom:1.2rem; letter-spacing:.04em; }
    .hero-role::before { content:'> '; color:var(--green); }
    .hero-bio { font-family:var(--mono); font-size:.82rem; color:var(--muted); line-height:1.85; margin-bottom:2rem; max-width:480px; }
    .hero-cta { display:flex; gap:1rem; flex-wrap:wrap; }

    .container { max-width:1100px; margin:0 auto; }

      .hero-scroll{display:none;}
      section{padding:4rem 1.5rem;}
      .about-layout{grid-template-columns:1fr;gap:2.5rem;}
      .skills-layout{grid-template-columns:1fr;}
      .proj-grid{grid-template-columns:1fr;}

  </style>

      description: "A backend-focused job management platform built on a microservices architecture using Spring Boot and Spring Cloud. The system follows industry-standard microservice principles such as service isolation, independent deployment, and centralized infrastructure components, including service discovery, API gateway routing, externalized configuration, and distributed tracing.",
      stack: ["Spring Boot","Spring Data JPA","PostgreSQL"],
      links: { github:"https://github.com/nirmalravidas/Spring-Boot-Job-List-Microservice-Application", live:"" }
    },
    {
      number: "02",
      title: "JWT-Based MERN Authentication System",
      type: "Full Stack", typeBadge: "fs",
      description: "Built a secure authentication system using the MERN Stack with features such as user registration, login, email verification, and password reset via secure tokens. Implemented password hashing using bcrypt and authentication using JSON Web Token (JWT). The application uses React and Tailwind CSS for the frontend and Node.js, Express.js, and MongoDB for the backend.",
      stack: ["Node.js","Express.js","MongoDB","JWT"],
      links: { github:"https://github.com/nirmalravidas/advanced-mern-authentication", live:"" }
    },
    // {
    //   number: "03",
    //   title: "Portfolio Website",
    //   type: "Full Stack", typeBadge: "fs",
    //   description: "This portfolio — designed and coded from scratch with a dark techy aesthetic, responsive layout, mobile menu, and smooth animations. Deployed on GitHub Pages.",
    //   stack: ["HTML5","CSS3","JavaScript","GitHub Pages"],
    //   links: { github:"https://github.com/nirmalravidas", live:"https://nirmalravidas.github.io" }
    // }
  ],

  contact: {
    subtext: "I'm open to internships, backend engineering roles, freelance projects, and open source collaborations. Let's build something great.",
    socials: [
      { label:"GitHub",   key:"github" },
      { label:"LinkedIn", key:"linkedin" }
    ]
  },

  meta: {
    footerNote: "Backend Developer",
    copyrightYear: "2026"
  }
};

// ─────────────────────────────────────────
//  RENDER FUNCTIONS
// ─────────────────────────────────────────
const { personal: P, about: A, skills: SK, experience: EX, projects: PR, contact: CO, meta: M } = CONTENT;

// helpers
const el = (tag, cls, html='') => { const e=document.createElement(tag); if(cls) e.className=cls; if(html) e.innerHTML=html; return e; };
const fi = (d=0) => `fi${d?` d${d}`:''}`;

// ── NAV ──
function renderNav() {
  const nameParts = P.name.split(' ');
  document.getElementById('navName').innerHTML = `${nameParts[0]}<span>.${nameParts.slice(1).join('')}</span>`;
  document.title = `${P.name} — ${P.role}`;

  const sections = ['about','skills','experience','projects','contact'];
  const ul = document.getElementById('navLinks');
  sections.forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = `<a href="#${s}">${s.charAt(0).toUpperCase()+s.slice(1)}</a>`;
    ul.appendChild(li);
  });

  const ns = document.getElementById('navStatus');
  if(P.availableForWork) ns.innerHTML = `<div class="status-dot"></div>Available`;

  // mobile drawer
  const mob = document.getElementById('mobileMenu');
  sections.forEach(s => {
    const a = document.createElement('a');
    a.href=`#${s}`; a.className='mob-link';
    a.textContent = s.charAt(0).toUpperCase()+s.slice(1);
    mob.appendChild(a);
  });
  if(P.availableForWork) {
    const d = el('div','mob-status','<div class="status-dot"></div> Available for work');
    mob.appendChild(d);
  }
}

// ── HERO ──
function renderHero() {
  const wrap = document.getElementById('heroInner');

  // Profile
  const profileHTML = P.profileImage
    ? `<img src="${P.profileImage}" alt="${P.name}">`
    : `<div class="avatar-placeholder"><div class="av-icon">👨‍💻</div><div class="av-text">Add your<br/>photo here</div></div>`;

  const profileDiv = el('div',`profile-wrap ${fi()}`,`
    <div class="profile-ring">
      <div class="profile-ring-inner">
        <div class="profile-img">${profileHTML}</div>
      </div>
    </div>
    ${P.availableForWork ? `<div class="profile-badge"><div class="status-dot"></div> Open to Work</div>` : ''}
  `);

  // Bio lines
  const bioLines = P.bio.split('\n').join('<br/>');

  const textDiv = el('div','hero-text',`
    <div class="${fi('1')} hero-eyebrow">${P.role}</div>
    <h1>
      <span class="${fi('1')}">${P.firstName}</span>
      <span class="outline ${fi('2')}">${P.lastName}</span>
    </h1>
    <div class="${fi('2')} hero-role">${P.tagline}</div>
    <p class="${fi('3')} hero-bio">${bioLines}</p>
    <div class="${fi('4')} hero-cta">
      <a href="#projects" class="btn btn-primary">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        View Projects
      </a>
      <a href="#contact" class="btn btn-ghost">Get In Touch</a>
    </div>
  `);

  wrap.appendChild(profileDiv);
  wrap.appendChild(textDiv);
}

// ── ABOUT ──
function renderAbout() {
  const c = document.getElementById('aboutContainer');
  const [h1, h2] = A.headline.split('\n');
  const statsHTML = A.stats.map(s => `<div class="stat-box"><div class="stat-n">${s.value}</div><div class="stat-l">${s.label}</div></div>`).join('');
  const chipsHTML = A.chips.map(ch => `<span class="chip">${ch}</span>`).join('');
  const parasHTML = A.paragraphs.map(p => `<p>${p}</p>`).join('');

  c.innerHTML = `
    <div class="about-layout">
      <div class="about-text ${fi()}">
        <div class="sec-label">Who I Am</div>
        <h2 class="sec-title">${h1} <em>${h2||''}</em></h2>
        ${parasHTML}
        <div class="chips">${chipsHTML}</div>
      </div>
      <div class="stat-grid ${fi('2')}">${statsHTML}</div>
    </div>`;
}

// ── SKILLS ──
function renderSkills() {
  const c = document.getElementById('skillsContainer');
  const cardsHTML = SK.map((s, i) => `
    <div class="skill-card ${fi(i%4||'')}">
      <div class="sk-header">
        <div class="sk-icon ${s.color}">${s.icon}</div>
        <div class="sk-name">${s.name}</div>
      </div>
      <div class="sk-tags">${s.tags.map(t=>`<span class="sk-tag">${t}</span>`).join('')}</div>
    </div>`).join('');

  c.innerHTML = `
    <div class="sec-label">What I Use</div>
    <h2 class="sec-title">Skills &amp; <em>Tech Stack</em></h2>
    <div class="skills-layout">${cardsHTML}</div>`;
}

// ── EXPERIENCE ──
function renderExperience() {
  const c = document.getElementById('experienceContainer');
  const itemsHTML = EX.map((e, i) => `
    <div class="tl-item ${fi(i%4||'')}">
      <div class="tl-dot"></div>
      <div class="tl-date">${e.date}</div>
      <div class="tl-role">${e.role}</div>
      <div class="tl-company">// ${e.company}</div>
      <div class="tl-desc">${e.description}</div>
    </div>`).join('');

  c.innerHTML = `
    <div class="sec-label">My Journey</div>
    <h2 class="sec-title">Experience &amp; <em>Education</em></h2>
    <div class="timeline">${itemsHTML}</div>`;
}

// ── PROJECTS ──
function renderProjects() {
  const c = document.getElementById('projectsContainer');
  const cardsHTML = PR.map((p, i) => {
    const linksHTML = [
      p.links.live    ? `<a href="${p.links.live}"    target="_blank" class="proj-link">Live ↗</a>`   : '',
      p.links.github  ? `<a href="${p.links.github}"  target="_blank" class="proj-link">GitHub ↗</a>` : ''
    ].filter(Boolean).join('');

    return `
    <div class="proj-card ${fi(i%4||'')}">
      <div class="proj-top">
        <div class="proj-num">${p.number} ——</div>
        <div class="proj-badge ${p.typeBadge}">${p.type}</div>
      </div>
      <div class="proj-title">${p.title}</div>
      <p class="proj-desc">${p.description}</p>
      <div class="proj-stack">${p.stack.map(t=>`<span>${t}</span>`).join('')}</div>
      <div class="proj-links">${linksHTML}</div>
    </div>`;
  }).join('');

  c.innerHTML = `
    <div class="sec-label">What I've Built</div>
    <h2 class="sec-title">Featured <em>Projects</em></h2>
    <div class="proj-grid">${cardsHTML}</div>`;
}

// ── CONTACT ──
function renderContact() {
  const c = document.getElementById('contactContainer');
  const socialsHTML = CO.socials.map(s => `<a href="${P[s.key]}" target="_blank" class="soc">${s.label}</a>`).join('');

  c.innerHTML = `
    <div class="contact-inner">
      <div class="sec-label" style="justify-content:center;">Let's Talk</div>
      <h2 class="sec-title ${fi()}" style="text-align:center;">Get In <em>Touch</em></h2>
      <p class="contact-pre ${fi()}">${CO.subtext}</p>
      <a href="mailto:${P.email}" class="contact-email ${fi()}">${P.email}</a>
      <div class="socials ${fi('1')}">${socialsHTML}</div>
    </div>`;
}

// ── FOOTER ──
function renderFooter() {
  document.getElementById('siteFooter').innerHTML = `
    <span>© ${M.copyrightYear} ${P.name} · ${M.footerNote}</span>
    <span><a href="${P.github}" target="_blank">${P.github.replace('https://','')}</a></span>`;
}

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
renderNav();
renderHero();
renderAbout();
renderSkills();
renderExperience();
renderProjects();
renderContact();
renderFooter();

// Mobile hamburger
const ham = document.getElementById('hamburger');
const mob = document.getElementById('mobileMenu');
ham.addEventListener('click', () => {
  ham.classList.toggle('open');
  mob.classList.toggle('open');
  document.body.style.overflow = mob.classList.contains('open') ? 'hidden' : '';
});
document.querySelectorAll('.mob-link').forEach(l => {
  l.addEventListener('click', () => {
    ham.classList.remove('open');
    mob.classList.remove('open');
    document.body.style.overflow = '';
  });
});

// Scroll fade-in
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('vis'); });
}, { threshold:0.1 });
document.querySelectorAll('.fi').forEach(el => obs.observe(el));
document.querySelectorAll('#hero .fi').forEach((el, i) => {
  setTimeout(() => el.classList.add('vis'), 100 + i * 150);
});

// Nav active highlight
const allSections = document.querySelectorAll('section[id]');
const navAs = document.querySelectorAll('.nav-links a');
window.addEventListener('scroll', () => {
  let cur = '';
  allSections.forEach(s => { if(scrollY >= s.offsetTop - 200) cur = s.id; });
  navAs.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + cur));
});
</script>
</body>
</html>
